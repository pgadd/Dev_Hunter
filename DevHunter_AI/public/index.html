<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevHunter AI | Automated Recruiter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
        }

        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .animate-pulse-slow {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .5;
            }
        }
    </style>
</head>

<body
    class="min-h-screen flex flex-col items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">

    <!-- Header -->
    <div class="text-center mb-10">
        <div class="inline-flex items-center justify-center p-3 bg-blue-600 rounded-xl shadow-lg mb-4">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                </path>
            </svg>
        </div>
        <h1 class="text-4xl font-bold text-white tracking-tight">DevHunter AI</h1>
        <p class="text-slate-400 mt-2">Autonomous Technical Recruitment Agent</p>
    </div>

    <!-- Main Card -->
    <div class="w-full max-w-2xl glass rounded-2xl p-8 shadow-2xl">

        <!-- Step 1: Input -->
        <div id="input-section">
            <label class="block text-sm font-medium text-slate-300 mb-2">Target GitHub Repository</label>
            <div class="flex gap-2">
                <input type="text" id="githubUrl" placeholder="https://github.com/username/project"
                    class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <button onclick="analyzeRepo()" id="analyzeBtn"
                    class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-lg font-semibold transition-all flex items-center gap-2">
                    <span>Analyze</span>
                </button>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="hidden py-8 text-center">
            <div
                class="inline-block w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-2">
            </div>
            <p class="text-slate-400">Reading code architecture...</p>
        </div>

        <!-- Step 2: Analysis Results -->
        <div id="results-section" class="hidden mt-8 space-y-6">
            <div class="border-t border-slate-700 pt-6">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h2 class="text-xl font-semibold text-white">Analysis Complete</h2>
                        <p class="text-sm text-slate-400" id="repoName">user/repo</p>
                    </div>
                    <span id="complexityBadge"
                        class="px-3 py-1 rounded-full text-xs font-bold bg-green-500/20 text-green-400">Complexity:
                        8/10</span>
                </div>

                <div class="bg-slate-900/50 rounded-lg p-4 mb-4">
                    <h3 class="text-xs font-uppercase tracking-wider text-slate-500 mb-2">TECH STACK SUMMARY</h3>
                    <p id="summaryText" class="text-slate-300 text-sm leading-relaxed"></p>
                </div>

                <div class="space-y-3">
                    <h3 class="text-xs font-uppercase tracking-wider text-slate-500">GENERATED INTERVIEW QUESTIONS</h3>
                    <div id="questionsList" class="space-y-2">
                        <!-- Questions injected here -->
                    </div>
                </div>
            </div>

            <!-- Step 3: Call Action -->
            <div class="border-t border-slate-700 pt-6">
                <label class="block text-sm font-medium text-slate-300 mb-2">Candidate Phone Number</label>
                <div class="flex gap-2">
                    <input type="tel" id="phoneNumber" placeholder="+15550000000" value="+1"
                        class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-green-500 focus:outline-none">
                    <button onclick="startCall()" id="callBtn"
                        class="bg-green-600 hover:bg-green-500 text-white px-6 py-3 rounded-lg font-semibold transition-all flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z">
                            </path>
                        </svg>
                        <span>Call Candidate</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Call Status Overlay -->
        <div id="call-status"
            class="hidden mt-6 bg-green-900/20 border border-green-500/30 rounded-lg p-4 flex items-center justify-between animate-pulse-slow">
            <div class="flex items-center gap-3">
                <span class="relative flex h-3 w-3">
                    <span
                        class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                </span>
                <span class="text-green-400 font-medium">Interview in Progress...</span>
            </div>
            <button onclick="location.reload()" class="text-xs text-slate-400 hover:text-white underline">Reset</button>
        </div>

    </div>

    <script>
        let currentCandidateId = null;

        async function analyzeRepo() {
            const url = document.getElementById('githubUrl').value;
            const btn = document.getElementById('analyzeBtn');
            const loading = document.getElementById('loading');
            const results = document.getElementById('results-section');

            if (!url) return alert("Please enter a GitHub URL");

            // UI Updates
            btn.disabled = true;
            btn.innerHTML = 'Analyzing...';
            loading.classList.remove('hidden');
            results.classList.add('hidden');

            try {
                const res = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ githubUrl: url })
                });

                const data = await res.json();
                if (data.error) throw new Error(data.error);

                currentCandidateId = data.id;

                // Populate UI
                document.getElementById('repoName').innerText = `${data.owner}/${data.repo}`;
                document.getElementById('summaryText').innerText = data.summary;
                document.getElementById('complexityBadge').innerText = `Complexity: ${data.complexity}/10`;

                const qList = document.getElementById('questionsList');
                qList.innerHTML = data.questions.map((q, i) =>
                    `<div class="bg-slate-800 p-3 rounded border-l-2 border-blue-500 text-sm text-slate-300">Q${i + 1}: ${q}</div>`
                ).join('');

                loading.classList.add('hidden');
                results.classList.remove('hidden');
                btn.innerHTML = 'Analyze';
                btn.disabled = false;

            } catch (e) {
                alert("Error: " + e.message);
                loading.classList.add('hidden');
                btn.disabled = false;
                btn.innerHTML = 'Analyze';
            }
        }

        async function startCall() {
            const phone = document.getElementById('phoneNumber').value;
            const btn = document.getElementById('callBtn');

            if (!phone || !currentCandidateId) return alert("Enter phone number and complete analysis first.");

            btn.disabled = true;
            btn.innerHTML = 'Dialing...';

            try {
                const res = await fetch('/api/call', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ candidateId: currentCandidateId, phoneNumber: phone })
                });

                const data = await res.json();
                if (data.error) throw new Error(data.error);

                document.getElementById('call-status').classList.remove('hidden');
                btn.innerHTML = 'Calling...';

            } catch (e) {
                alert("Call Failed: " + e.message);
                btn.disabled = false;
                btn.innerHTML = 'Call Candidate';
            }
        }
    </script>
</body>

</html>
